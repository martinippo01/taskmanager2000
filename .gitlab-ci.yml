image: docker:latest

services:
  - docker:dind # Enables Docker commands in CI

variables:
  IMAGE_REGISTRY: "martinippo"
  IMAGE_PREFIX: "taskmanager2000"
  DOCKER_DRIVER: overlay2 # Optimized storage driver for GitLab CI

stages:
  - build
  - push

before_script:
  - apt-get update && apt-get install -y tar
  - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

build_and_push:
  stage: build
  script:
    - |
      for service in orquestador scheduler task-service wf-manager; do
      echo "Building $service...";
      # docker build -t $IMAGE_REGISTRY/$IMAGE_PREFIX-$service:latest $service;
      "tar -czh . | docker build - -t $IMAGE_REGISTRY/$IMAGE_PREFIX-$service:latest";
      docker tag $IMAGE_REGISTRY/$IMAGE_PREFIX-$service:latest $IMAGE_REGISTRY/$IMAGE_PREFIX-$service:$CI_COMMIT_SHORT_SHA;
      echo "Pushing $service...";
      docker push $IMAGE_REGISTRY/$IMAGE_PREFIX-$service:latest;
      docker push $IMAGE_REGISTRY/$IMAGE_PREFIX-$service:$CI_COMMIT_SHORT_SHA;
      done

# tar -czh . | docker build - -t [MICROSERVICE]:[VERSION]
