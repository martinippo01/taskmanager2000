stages:
  - test
  - build

test-orquestador:
  stage: test
  script:
    - echo "Testing orquestador ..."
  rules:
    - changes:
        - orquestador/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

test-scheduler:
  stage: test
  script:
    - echo "Testing scheduler ..."
  rules:
    - changes:
        - scheduler/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

test-task-service:
  stage: test
  script:
    - echo "Testing task-service ..."
  rules:
    - changes:
        - task-service/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

test-wf-manager:
  stage: test
  script:
    - echo "Testing wf-manager ..."
  rules:
    - changes:
        - wf-manager/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

build-orquestador:
  stage: build
  trigger:
    include: orquestador/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - orquestador/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

build-scheduler:
  stage: build
  trigger:
    include: scheduler/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - scheduler/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

build-task-service:
  stage: build
  trigger:
    include: task-service/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - task-service/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

build-wf-manager:
  stage: build
  trigger:
    include: wf-manager/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - wf-manager/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
