stages:
  - test
  - build
  - deploy

test-orquestador:
  stage: test
  trigger:
    include: orquestador/.gitlab-ci-test.yml
    strategy: depend
  rules:
    - changes:
        - orquestador/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

